[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-photo-export"
version = "0.2.0"
description = "Local Windows desktop tool for exporting high-resolution WeChat photos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pycryptodome>=3.23,<5", "Pillow>=12.3,<13"]

[project.urls]
Repository = "https://github.com/joyup/WxExportImage"
Issues = "https://github.com/joyup/WxExportImage/issues"

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.12,<7"]
build = ["PyInstaller==6.22.3"]

[project.gui-scripts]
wechat-photo-export = "wechat_photo_export.__main__:main"

[project.scripts]
wechat-photo-cli = "wechat_photo_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
