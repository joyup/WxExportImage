name: Windows checks
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.lock
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m wechat_photo_export --self-test
      - run: python tools/prepare_public_source.py
  package:
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.lock
      - run: python tools/prepare_public_source.py
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-portable-unsigned
          path: |
            dist/WeChatPhotoExport-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/wechat-photo-export-source.zip
            dist/wechat-photo-export-source.zip.sha256
          retention-days: 14
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download verified build files
        run: gh run download "$GITHUB_RUN_ID" --name Windows-portable-unsigned --dir dist
      - name: Publish preview release
        run: python tools/publish_release.py --tag "$RELEASE_TAG" --repo "$GH_REPO" --directory dist
